spring.application.name=telemetry-service

# TimescaleDB (Primary database for telemetry)
spring.datasource.url=jdbc:postgresql://timescaledb:5432/telemetry
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Main PostgreSQL database (for sensors table)
sensors.datasource.url=jdbc:postgresql://postgres:5432/smarthome
sensors.datasource.username=postgres
sensors.datasource.password=postgres
sensors.datasource.driver-class-name=org.postgresql.Driver

# Temperature API configuration
temperature.api.base-url=http://temperature-api:8081

# Telemetry collection schedule (cron expression: every 1 minute)
telemetry.collection.cron=*/30 * * * * *

# Application configuration
logging.level.com.smarthome.telemetry=INFO
logging.level.org.springframework.web=INFO

